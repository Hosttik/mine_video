[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mine-video"
version = "0.1.0"
description = "A local production queue for videos captured from the real Minecraft client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "obsws-python>=1.7,<2", "mcrcon>=0.7,<1", "portalocker>=3,<4", "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
mine-video = "mine_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mine_video = ["templates/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
