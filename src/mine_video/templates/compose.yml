services:
  mc:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: PAPER
      VERSION: "1.21.4"
      PAPER_BUILD: "232"
      MEMORY: 3G
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?Run mine-video init first}"
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: "${CAMERA_PLAYER:?Set the camera account name}"
      MAX_PLAYERS: "1"
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      MOTD: "MineVideo dedicated recording studio"
      LEVEL: world
      GENERATE_STRUCTURES: "false"
      TZ: UTC
    ports:
      - "127.0.0.1:25565:25565"
      - "127.0.0.1:25575:25575"
    volumes:
      - ./server-data:/data
    restart: unless-stopped
    stop_grace_period: 60s
